# Keeps the free-plan Supabase project awake.
# Supabase pauses free projects after ~7 days without activity, so this
# runs a tiny database query once a day.
#
# Setup (once): GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_URL       e.g. https://xxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY  the anon / public key (same one as in config.js)

name: Supabase keep-alive

on:
  schedule:
    - cron: '30 3 * * *'   # every day at 03:30 UTC (09:00 IST)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          # A real REST query on a table in the "myexpenses" schema, so it reaches Postgres.
          code=$(curl -sS -o response.txt -w '%{http_code}' --retry 3 --retry-delay 10 \
            "${SUPABASE_URL%/}/rest/v1/expense_lists?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Accept-Profile: myexpenses")
          echo "HTTP $code"; cat response.txt; echo
          # 2xx = rows (or [] from Row Level Security).
          # 42501 "permission denied" = the anon role has no table grants (see schema.sql); that error
          # comes from Postgres itself, so the database is awake too.
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then exit 0; fi
          if grep -q '"42501"' response.txt; then exit 0; fi
          # Anything else (paused project, wrong URL/key, schema not exposed): fail, GitHub emails you.
          exit 1
